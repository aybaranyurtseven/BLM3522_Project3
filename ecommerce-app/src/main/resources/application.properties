spring.application.name=ecommerce

# Server port
server.port=8080

# H2 Embedded Database (runs inside the app, no external DB needed)
spring.datasource.url=jdbc:h2:mem:ecommercedb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate ddl-auto (update creates/updates tables automatically)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console (for debugging, optional)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf cache (disable for local development)
spring.thymeleaf.cache=false
